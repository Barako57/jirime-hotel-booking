<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Jirime Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="bg-black text-white px-6 py-4 flex justify-between">
    <h1 class="font-bold text-xl">JIRIME RESORT</h1>
    <ul class="flex gap-6">
      <li><a href="index.html">Home</a></li>
      <li><a href="rooms.html">Rooms</a></li>
      <li><a href="booking.html">Booking</a></li>
      <li><a href="restaurant.html">Restaurant</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
  </nav>

  <form id="loginForm" onsubmit="handleAdminLogin(event)">
  <input id="username" type="text" placeholder="Username" required>
  <input id="password" type="password" placeholder="Password" required>
  <button type="submit">Login</button>
</form>

<button onclick="adminLogout()">Logout</button>

  <section id="admin" class="p-6">
    <h2 class="text-2xl font-bold mb-4">Admin Dashboard</h2>
    <table id="bookingsTable" class="border w-full">
      <tr class="bg-gray-200">
        <th>Name</th><th>Check-in</th><th>Check-out</th>
        <th>Guests</th><th>Room</th><th>Total</th><th>Actions</th>
      </tr>
    </table>
  </section>

  <script src="script.js"></script>
</body>
</html>
