<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking - Jirime Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="bg-black text-white px-6 py-4 flex justify-between">
    <h1 class="font-bold text-xl">JIRIME RESORT</h1>
    <ul class="flex gap-6">
      <li><a href="index.html">Home</a></li>
      <li><a href="rooms.html">Rooms</a></li>
      <li><a href="booking.html">Booking</a></li>
      <li><a href="restaurant.html">Restaurant</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
  </nav>

  <section id="booking" class="p-6">
    <h2 class="text-2xl font-bold mb-4">Book Your Stay</h2>
    <form id="bookingForm" class="grid gap-3 max-w-md">
      <input id="name" placeholder="Name" class="border p-2" required>
      <input id="checkin" type="date" class="border p-2" required>
      <input id="checkout" type="date" class="border p-2" required>
      <input id="guests" type="number" placeholder="Guests" class="border p-2" required>
      <select id="roomType" class="border p-2">
        <option value="Deluxe">Deluxe</option>
        <option value="Executive Suite">Executive Suite</option>
        <option value="Family Room">Family Room</option>
      </select>
      <div id="totalCost" class="font-bold">Total: Ksh 0</div>
      <button type="submit" class="bg-black text-white py-2">Confirm Booking</button>
    </form>
    <div id="confirmationMessage" class="mt-4"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
